# PostgreSQL and Redis are managed services, so DATABASE_URL and REDIS_URL in backend/.env point at them.
# Run with: docker compose --env-file frontend/.env up --build
# (the frontend's API URL is baked in at build time, so compose must read it from that file)
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL, for example with --env-file frontend/.env}
    ports:
      - "5173:8080"
